name: W6 P15 actual native 128 cube trained PINO pilot
on:
  push:
    branches:
      - research/neuralmoments-w6-pcraft-20261019
    paths:
      - research/NeuralMoments/models/pcraft_ufno/p0_integration/p15_128_native_train.py
      - research/NeuralMoments/models/pcraft_ufno/p0_integration/tests/test_p15_training.py
      - research/NeuralMoments/models/pcraft_ufno/p0_integration/P15_PROTOCOL.md
      - research/NeuralMoments/models/pcraft_ufno/spin_pino/train.py
      - research/NeuralMoments/models/pcraft_ufno/spin_pino/pino_backbone.py
      - .github/workflows/w6-p15-128-native-training.yml
  workflow_dispatch:
jobs:
  native-128-pino-training:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned CPU PyTorch
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pytest
      - name: Test geometry-grouped rotations and checkpointed chunked training
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m pytest -q research/NeuralMoments/models/pcraft_ufno/p0_integration/tests/test_p15_training.py
      - name: Train the actual 128-cube P-CRAFT PINO backbone
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m research.NeuralMoments.models.pcraft_ufno.p0_integration.p15_128_native_train \
            --seed 271 --steps 12 --output /tmp/w6_p15_128_native_pino.json
      - name: Archive trained 128-cube PINO and full receipts
        uses: actions/upload-artifact@v4
        with:
          name: w6-p15-native-128-trained-pino
          path: |
            /tmp/w6_p15_128_native_pino.json
            /tmp/w6_p15_grid128_seed271.pt
          if-no-files-found: error
          retention-days: 30
