name: W6 P13b 128 cube native Fourier RAM gate
on:
  push:
    branches:
      - research/neuralmoments-w6-pcraft-20261019
    paths:
      - research/NeuralMoments/models/pcraft_ufno/densicrafter_pino/P13B_128_NATIVE_GATE.md
      - .github/workflows/w6-p13b-128-native-Fourier.yml
  workflow_dispatch:
jobs:
  cpu-128-native-one-backward:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned Torch for actual 128 cube CPU Fourier test
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy
      - name: Single 128 cube native F-FNO/U-FNO and Densi density gradient
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m research.NeuralMoments.models.pcraft_ufno.densicrafter_pino.p13b_operator_grid \
            --source 128 --operator 128 \
            --output /tmp/w6_p13b_128_native_fourier.json
      - name: Preserve native 128 Fourier validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: w6-p13b-128-native-fourier
          path: /tmp/w6_p13b_128_native_fourier.json
          if-no-files-found: error
          retention-days: 30
