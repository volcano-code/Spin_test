name: W0 mathematical contracts and frozen consumer interfaces
on:
  push:
    branches:
      - research/neuralmoments-w0-contract-20261019
    paths:
      - '.github/workflows/w0-contract-ci.yml'
      - 'research/NeuralMoments/contracts/**'
      - 'research/ParallelLaunch/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pure-python-contracts:
    name: W0 structural math and consumer regression (no native teacher)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install lightweight dependencies
        run: python -m pip install 'numpy>=2,<3' 'pytest>=8,<10'
      - name: Run exact committed W0 math and interface tests
        run: |
          python -m pytest -q \
            research/NeuralMoments/contracts/test_contract_v1.py \
            research/NeuralMoments/contracts/test_validate_contract_v1.py \
            research/NeuralMoments/contracts/test_w2_teacher_gate.py \
            research/NeuralMoments/contracts/test_cross_window_release_m15.py \
            research/NeuralMoments/contracts/test_cross_window_interface_m16.py \
            research/NeuralMoments/contracts/test_consumer_v2_preview_m17.py \
            research/NeuralMoments/contracts/test_w5_contract_gate_v2_m18.py \
            research/NeuralMoments/contracts/test_w5_live_handoff_m19.py
      - name: Independently audit frozen W2 W5 W6 source interface
        run: |
          python -m research.NeuralMoments.contracts.cross_window_interface_m16 \
            --output "$RUNNER_TEMP/w0-m16-interface-audit.json"
      - name: Run pinned W5 legacy-vs-W0 native-c counterexample
        run: |
          python -m research.NeuralMoments.contracts.consumer_v2_preview_m17 \
            --output "$RUNNER_TEMP/w0-m17-w5-v2-migration-block.json"
      - name: Audit live W5 W2 Git refs (read-only, fail closed on new drift)
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/research/neuralmoments-w5-deeponet-20261019
          w5_head="$(git rev-parse FETCH_HEAD)"
          w5_blob="$(git rev-parse 'FETCH_HEAD:research/NeuralMoments/models/deeponet/contract_gate.py')"
          git show 'FETCH_HEAD:research/NeuralMoments/models/deeponet/contract_gate.py' > "$RUNNER_TEMP/w0-m19-current-w5-gate.py"
          git fetch --no-tags --depth=1 origin refs/heads/research/neuralmoments-w2-teacher-20261019
          w2_head="$(git rev-parse FETCH_HEAD)"
          w2_blob="$(git rev-parse 'FETCH_HEAD:research/NeuralMoments/teacher/teacher_manifest.json')"
          git show 'FETCH_HEAD:research/NeuralMoments/teacher/teacher_manifest.json' > "$RUNNER_TEMP/w0-m19-current-w2-manifest.json"
          python -m research.NeuralMoments.contracts.w5_live_handoff_m19 \
            --w5-source "$RUNNER_TEMP/w0-m19-current-w5-gate.py" \
            --w5-head "$w5_head" --w5-blob "$w5_blob" \
            --w2-manifest "$RUNNER_TEMP/w0-m19-current-w2-manifest.json" \
            --w2-head "$w2_head" --w2-blob "$w2_blob" \
            --output "$RUNNER_TEMP/w0-m19-live-w5-w2-adoption.json"
      - name: Upload CI interface denial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w0-m17-ci-nonnative-interface-evidence
          path: |
            ${{ runner.temp }}/w0-m16-interface-audit.json
            ${{ runner.temp }}/w0-m17-w5-v2-migration-block.json
            ${{ runner.temp }}/w0-m19-live-w5-w2-adoption.json
          if-no-files-found: warn
