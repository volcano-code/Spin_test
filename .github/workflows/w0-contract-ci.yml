name: W0 mathematical contracts and frozen consumer interfaces
on:
  push:
    branches:
      - research/neuralmoments-w0-contract-20261019
    paths:
      - '.github/workflows/w0-contract-ci.yml'
      - 'research/NeuralMoments/contracts/**'
      - 'research/ParallelLaunch/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pure-python-contracts:
    name: W0 structural math and consumer regression (no native teacher)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install lightweight dependencies
        run: python -m pip install 'numpy>=2,<3' 'pytest>=8,<10'
      - name: Run exact committed W0 math and interface tests
        run: |
          python -m pytest -q \
            research/NeuralMoments/contracts/test_contract_v1.py \
            research/NeuralMoments/contracts/test_validate_contract_v1.py \
            research/NeuralMoments/contracts/test_w2_teacher_gate.py \
            research/NeuralMoments/contracts/test_cross_window_release_m15.py \
            research/NeuralMoments/contracts/test_cross_window_interface_m16.py \
            research/NeuralMoments/contracts/test_consumer_v2_preview_m17.py \
            research/NeuralMoments/contracts/test_w5_contract_gate_v2_m18.py \
            research/NeuralMoments/contracts/test_w5_live_handoff_m19.py \
            research/NeuralMoments/contracts/test_p30_teapot_physical_review_m20.py \
            research/NeuralMoments/contracts/test_teapot_moment_frame_m21.py \
            research/NeuralMoments/contracts/test_p30_teapot_source_binding_m21.py
      - name: Independently audit frozen W2 W5 W6 source interface
        run: |
          python -m research.NeuralMoments.contracts.cross_window_interface_m16 \
            --output "$RUNNER_TEMP/w0-m16-interface-audit.json"
      - name: Run pinned W5 legacy-vs-W0 native-c counterexample
        run: |
          python -m research.NeuralMoments.contracts.consumer_v2_preview_m17 \
            --output "$RUNNER_TEMP/w0-m17-w5-v2-migration-block.json"
      - name: Audit live W5 W2 Git refs (read-only, fail closed on new drift)
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/research/neuralmoments-w5-deeponet-20261019
          w5_head="$(git rev-parse FETCH_HEAD)"
          w5_blob="$(git rev-parse 'FETCH_HEAD:research/NeuralMoments/models/deeponet/contract_gate.py')"
          git show 'FETCH_HEAD:research/NeuralMoments/models/deeponet/contract_gate.py' > "$RUNNER_TEMP/w0-m19-current-w5-gate.py"
          git fetch --no-tags --depth=1 origin refs/heads/research/neuralmoments-w2-teacher-20261019
          w2_head="$(git rev-parse FETCH_HEAD)"
          w2_blob="$(git rev-parse 'FETCH_HEAD:research/NeuralMoments/teacher/teacher_manifest.json')"
          git show 'FETCH_HEAD:research/NeuralMoments/teacher/teacher_manifest.json' > "$RUNNER_TEMP/w0-m19-current-w2-manifest.json"
          set +e
          python -m research.NeuralMoments.contracts.w5_live_handoff_m19 \
            --w5-source "$RUNNER_TEMP/w0-m19-current-w5-gate.py" \
            --w5-head "$w5_head" --w5-blob "$w5_blob" \
            --w2-manifest "$RUNNER_TEMP/w0-m19-current-w2-manifest.json" \
            --w2-head "$w2_head" --w2-blob "$w2_blob" \
            --output "$RUNNER_TEMP/w0-m19-live-w5-w2-adoption.json" \
            > "$RUNNER_TEMP/w0-m19-live-audit.log" 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            cat "$RUNNER_TEMP/w0-m19-live-audit.log"
          elif grep -q "W2_NATIVE_RELEASE_CHANGED_REQUIRES_INDEPENDENT_REVIEW" "$RUNNER_TEMP/w0-m19-live-audit.log"; then
            python -c 'import json,sys; out,w5h,w5b,w2h,w2b=sys.argv[1:]; json.dump({"status":"W2_NATIVE_RELEASE_CHANGED_REQUIRES_INDEPENDENT_REVIEW","w5_head":w5h,"w5_contract_gate_blob":w5b,"w2_head":w2h,"w2_manifest_blob":w2b,"w2_native_teacher_runs":1,"w2_training_samples":0,"w2_J_D":None,"w2_split":"excluded","training_admitted":False,"newton_admitted":False,"reason":"M19 frozen manifest gate rejected changed W2 diagnostic history; preserve block pending independent review"},open(out,"w"),indent=2)' \
              "$RUNNER_TEMP/w0-m19-live-w5-w2-adoption.json" "$w5_head" "$w5_blob" "$w2_head" "$w2_blob"
            echo "W2 changed; fail-closed independent review required. No teacher admission."
          else
            cat "$RUNNER_TEMP/w0-m19-live-audit.log"
            exit "$rc"
          fi
      - name: Fetch pinned W4 P19/P20 sources and recompute SHA-256 from actual bytes
        shell: bash
        run: |
          set -euo pipefail
          W4_BRANCH="research/neuralmoments-w4-teapot-p1-20261019"
          W4_REVIEWED_HEAD="aca53abf0d31329264fe1f028b2aff2175165ba3"
          git fetch --no-tags --depth=1 origin "refs/heads/$W4_BRANCH"
          w4_head="$(git rev-parse FETCH_HEAD)"
          test "$w4_head" = "$W4_REVIEWED_HEAD"
          mkdir -p "$RUNNER_TEMP/w0-m21-w4" "$RUNNER_TEMP/w0-m21-core"
          git archive "$w4_head" research/SpinIt2014_Teapot_20261018/P1 | tar -x -C "$RUNNER_TEMP/w0-m21-w4"
          CORE_COMMIT="58fd12c1306c1c01679a19172e276eef0cb30542"
          git fetch --no-tags --depth=1 origin "$CORE_COMMIT"
          git archive "$CORE_COMMIT" \
            bindings/pybind_module.cpp \
            include/physics/RawMassMoments10.h \
            include/spin/QuadricCoefficients.h \
            python/make_it_stand/spin.py \
            python/make_it_stand/verification/cherchi_inprocess.py \
            python/make_it_stand/verification/faster_material.py \
            python/make_it_stand/verification/spin_common.py \
            python/make_it_stand/verification/spin_problem.py \
            src/spin/DualMonomialCoordinates.cpp \
            src/spin/QuadricCoefficients.cpp | tar -x -C "$RUNNER_TEMP/w0-m21-core"
          P1="$RUNNER_TEMP/w0-m21-w4/research/SpinIt2014_Teapot_20261018/P1"
          python -m research.NeuralMoments.contracts.p30_teapot_source_binding_m21 \
            --w4-root "$P1" --w4-head "$w4_head" \
            --core-root "$RUNNER_TEMP/w0-m21-core" --core-commit "$CORE_COMMIT" \
            --review-evidence research/NeuralMoments/contracts/p30_teapot_review_evidence_m20.json \
            --output "$RUNNER_TEMP/w0-m21-source-binding.json"
          python -m research.NeuralMoments.contracts.teapot_moment_frame_m21 \
            --request "$P1/P20_native_request.json" \
            --frame-report "$P1/P20_EXACT_FRAME_AND_PHYSICS_REPORT.json" \
            --output "$RUNNER_TEMP/w0-m21-moment-frame-contract.json"
          echo "W0_M21_DIRECT_W4_BYTES_AND_NATIVE_SI_FRAME_CONTRACT_PASS"
      - name: Run W0 P30 physical-case review (BLOCKED is expected; no authorization)
        shell: bash
        run: |
          set +e
          python -m research.NeuralMoments.contracts.p30_teapot_physical_review_m20 \
            --evidence research/NeuralMoments/contracts/p30_teapot_review_evidence_m20.json \
            --output "$RUNNER_TEMP/P30_TEAPOT_PHYSICAL_REVIEW_BLOCKED_20261108.json"
          rc=$?
          set -e
          test "$rc" -eq 3
          python -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["decision"] == "BLOCKED_PHYSICAL_CASE_NOT_OWNER_APPROVED"; assert d["newton_authorized"] is False and d["training_authorized"] is False' "$RUNNER_TEMP/P30_TEAPOT_PHYSICAL_REVIEW_BLOCKED_20261108.json"
      - name: Upload CI interface denial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w0-m17-ci-nonnative-interface-evidence
          path: |
            ${{ runner.temp }}/w0-m16-interface-audit.json
            ${{ runner.temp }}/w0-m17-w5-v2-migration-block.json
            ${{ runner.temp }}/w0-m19-live-w5-w2-adoption.json
            ${{ runner.temp }}/w0-m21-source-binding.json
            ${{ runner.temp }}/w0-m21-moment-frame-contract.json
            ${{ runner.temp }}/P30_TEAPOT_PHYSICAL_REVIEW_BLOCKED_20261108.json
          if-no-files-found: warn
