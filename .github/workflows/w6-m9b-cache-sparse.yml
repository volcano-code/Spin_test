name: W6 M9b cached geometry and sparse bridge
on:
  push:
    branches:
      - research/neuralmoments-w6-pcraft-20261019
    paths:
      - research/NeuralMoments/models/pcraft_ufno/spin_pino/m9b_cache.py
      - research/NeuralMoments/models/pcraft_ufno/spin_pino/sparse_bridge.py
      - research/NeuralMoments/models/pcraft_ufno/spin_pino/m9b_benchmark.py
      - research/NeuralMoments/models/pcraft_ufno/spin_pino/M9B_PROTOCOL.md
      - research/NeuralMoments/models/pcraft_ufno/spin_pino/tests/test_m9b_cache_sparse.py
      - .github/workflows/w6-m9b-cache-sparse.yml
  workflow_dispatch:
jobs:
  m9b-cpu-contract-and-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU numerical dependencies
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pytest
      - name: Verify M9b safety and M9 regression
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m pytest -q \
            research/NeuralMoments/models/pcraft_ufno/spin_pino/tests/test_m9b_cache_sparse.py \
            research/NeuralMoments/models/pcraft_ufno/spin_pino/tests/test_m9_mass_transport.py
      - name: Benchmark exact-input repeated PINO queries and sparse 512 interface
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m research.NeuralMoments.models.pcraft_ufno.spin_pino.m9b_benchmark \
            --queries 6 --source-resolution 512 --sparse-records 4096 \
            --output /tmp/w6_m9b_cache_sparse.json
      - name: Archive numerical evidence
        uses: actions/upload-artifact@v4
        with:
          name: w6-m9b-cache-sparse-evidence
          path: /tmp/w6_m9b_cache_sparse.json
          retention-days: 30
          if-no-files-found: error
