# W4-owned workflow. Diagnostic physics ONLY; this is not Cherchi optimization.
# Authorized for this W4 branch by user; never runs against main.
name: W4 Teapot MuJoCo diagnostic (not Cherchi)

on:
  push:
    branches:
      - research/neuralmoments-w4-teapot-p1-20261019
    paths:
      - .github/workflows/w4-teapot-mujoco.yml
      - research/SpinIt2014_Teapot_20261018/P1/**
      - research/SpinIt2014_Teapot_20261018/input/teapot-public-original.obj
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: w4-teapot-mujoco-${{ github.ref }}
  cancel-in-progress: false

jobs:
  actual-mujoco-diagnostic:
    if: github.ref == 'refs/heads/research/neuralmoments-w4-teapot-p1-20261019'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      P1: research/SpinIt2014_Teapot_20261018/P1
    steps:
      - name: Checkout the exact W4 branch revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install native OpenSCAD and offscreen Mesa renderer
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y openscad ffmpeg libosmesa6 libgl1-mesa-dri libgl1 libegl1 libglib2.0-0
          python -m pip install --upgrade pip
          python -m pip install 'numpy>=2,<3' 'scipy>=1.15,<2' 'trimesh>=4,<5' 'networkx>=3,<4' 'opencv-python-headless>=4,<5' 'mujoco==3.3.7' 'PyOpenGL>=3.1.7' pillow
          python - <<'PY'
          import mujoco, numpy, scipy, trimesh, cv2, OpenGL
          print('REAL ENGINE:', mujoco.__version__)
          print('MuJoCo module:', mujoco.__file__)
          print('Scientific versions:', numpy.__version__, scipy.__version__, trimesh.__version__, cv2.__version__)
          PY
          openscad --version
          ffmpeg -version | head -n 2

      - name: Reproduce pinned P2 diagnostic mesh and MJCF
        run: |
          set -euo pipefail
          mkdir -p "$P1/p4-actual-mujoco"
          git rev-parse HEAD | tee "$P1/p4-actual-mujoco/git-commit.txt"
          python "$P1/p5_cloud_scene_bootstrap.py" --output "$P1/p5-cloud-mujoco-scene" | tee "$P1/p4-actual-mujoco/scene-rebuild.log"
          python "$P1/p4_mujoco_verified_video.py" --xml "$P1/p5-cloud-mujoco-scene/teapot_spinning.xml" --preflight-only | tee "$P1/p4-actual-mujoco/preflight.json"

      - name: Check cross-version physics invariants and rejection tests
        run: |
          set -euo pipefail
          python -m unittest discover -v -s "$P1" -p 'test_p5_cloud_scene_bootstrap.py' 2>&1 | tee "$P1/p4-actual-mujoco/cloud-scene-tests.log"

      - name: Verify real MuJoCo model loads and diagnostic physics runs
        run: |
          set -euo pipefail
          python - <<'PY'
          import mujoco
          from pathlib import Path
          xml=Path('research/SpinIt2014_Teapot_20261018/P1/p5-cloud-mujoco-scene/teapot_spinning.xml')
          m=mujoco.MjModel.from_xml_path(str(xml.resolve()))
          d=mujoco.MjData(m)
          mujoco.mj_forward(m,d)
          print('MuJoCo loaded model',dict(nbody=m.nbody,ngeom=m.ngeom,nq=m.nq,nv=m.nv,
                                             timestep=float(m.opt.timestep)))
          assert (m.nq,m.nv)==(7,6)
          PY

      - name: Execute MuJoCo dynamics and export three-way H.264 MP4
        run: |
          set -euo pipefail
          python "$P1/p4_mujoco_verified_video.py" --xml "$P1/p5-cloud-mujoco-scene/teapot_spinning.xml" --out "$P1/p4-actual-mujoco" --duration 2.8 --fps 24 | tee "$P1/p4-actual-mujoco/execution.log"
          test -s "$P1/p4-actual-mujoco/mujoco_teapot_comparison.mp4"
          test -s "$P1/p4-actual-mujoco/mujoco_video_results.json"
          python - <<'PY'
          from pathlib import Path
          import json
          import subprocess
          p=Path('research/SpinIt2014_Teapot_20261018/P1/p4-actual-mujoco')
          data=json.loads((p/'mujoco_video_results.json').read_text())
          assert data['status']=='REAL_MUJOCO_ENGINE_AND_VIDEO_EXECUTED'
          assert data['source_geometry']=='P2_CGAL_DIAGNOSTIC_PROXY_NOT_CHERCHI'
          assert len(data['results'])==3
          for speed in (0,30,60):
              assert (p/f'mujoco_{speed}_rad_s.csv').stat().st_size>100
          probe=json.loads(subprocess.check_output(['ffprobe','-v','error',
              '-select_streams','v:0','-show_entries','stream=codec_name,width,height,nb_frames',
              '-of','json',str(p/'mujoco_teapot_comparison.mp4')],text=True))
          v=probe['streams'][0]
          assert v['codec_name']=='h264' and v['width']==1320 and v['height']==480
          print('VERIFIED_REAL_MUJOCO_DIAGNOSTIC:',data['engine_version'],v)
          PY
          sha256sum "$P1/p4-actual-mujoco/"* > "$P1/p4-actual-mujoco/files.sha256"

      - name: Validate same-speed mass relocation mathematical controls
        run: |
          set -euo pipefail
          export W4_P6_TEST_SCENE_XML="$P1/p5-cloud-mujoco-scene/teapot_spinning.xml"
          python -m unittest discover -v -s "$P1" -p 'test_p6_mujoco_mass_shift_comparison.py' 2>&1 | tee "$P1/p4-actual-mujoco/mass-shift-tests.log"

      - name: Execute real MuJoCo same-speed before vs hypothetical mass redistribution
        run: |
          set -euo pipefail
          python "$P1/p6_mujoco_mass_shift_comparison.py" --xml "$P1/p5-cloud-mujoco-scene/teapot_spinning.xml" --out "$P1/p4-actual-mujoco" --duration 2.8 --fps 24 | tee "$P1/p4-actual-mujoco/ab_execution.log"
          test -s "$P1/p4-actual-mujoco/mujoco_baseline_vs_hypothetical_mass_shift.mp4"
          test -s "$P1/p4-actual-mujoco/mujoco_ab_results.json"
          python - <<'PY'
          from pathlib import Path
          import json, subprocess
          p=Path('research/SpinIt2014_Teapot_20261018/P1/p4-actual-mujoco')
          m=json.loads((p/'mujoco_ab_results.json').read_text())
          assert m['status']=='REAL_MUJOCO_AB_DIAGNOSTIC_EXECUTED'
          assert m['source_geometry']=='P2_CGAL_PROXY_NOT_CHERCHI'
          assert m['optimization_source']=='NONE_ANALYTIC_HYPOTHETICAL_MASS_RELOCATION'
          assert len(m['results'])==2 and all(row['samples']==69 for row in m['results'])
          for csv in ('baseline.csv','hypothetical_mass_shift.csv'):
              assert (p/csv).stat().st_size>100
          probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries',
              'stream=codec_name,width,height,nb_frames','-select_streams','v:0','-of','json',
              str(p/'mujoco_baseline_vs_hypothetical_mass_shift.mp4')],text=True))['streams'][0]
          assert (probe['codec_name'],probe['width'],probe['height'])==('h264',1240,680)
          print('REAL_MUJOCO_AB_VIDEO_VERIFIED',probe)
          PY
          sha256sum "$P1/p4-actual-mujoco/"* > "$P1/p4-actual-mujoco/files.sha256"

      - name: Upload artifacts, including diagnostics on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: W4-actual-MuJoCo-CGAL-diagnostic-not-Cherchi-optimization
          path: |
            research/SpinIt2014_Teapot_20261018/P1/p4-actual-mujoco/**
            research/SpinIt2014_Teapot_20261018/P1/p5-cloud-mujoco-scene/simulation-manifest.json
            research/SpinIt2014_Teapot_20261018/P1/p5-cloud-mujoco-scene/teapot_spinning.xml
            research/SpinIt2014_Teapot_20261018/P1/p5-cloud-mujoco-scene/teapot_counterfactual_mass_shift_30g.xml
            research/SpinIt2014_Teapot_20261018/P1/p5-cloud-mujoco-scene/mass_shift_case.json
            research/SpinIt2014_Teapot_20261018/P1/p5-cloud-mujoco-scene/p5-scene-certificate.json
          if-no-files-found: warn
          retention-days: 30


  # Genuine original Cherchi (not CGAL) source geometry pipeline.
  # Resource agreement: sequential after the MuJoCo job, <=2 build workers,
  # native binary identity pinned, bounded runtime. Do not promote to W0/W2.
  pinned-cherchi-teapot-union:
    if: github.ref == 'refs/heads/research/neuralmoments-w4-teapot-p1-20261019'
    needs: actual-mujoco-diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      P1: research/SpinIt2014_Teapot_20261018/P1
      NATIVE_ROOT: external/reference-sources-20260917/sources/InteractiveAndRobustMeshBooleans-7bd6c2697695f555f9a15d7e154e084d841316f0
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned-Cherchi reference build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y ninja-build cmake libgmp-dev libmpfr-dev libboost-all-dev libtbb-dev libeigen3-dev libgl1-mesa-dev libglu1-mesa-dev libx11-dev libxi-dev libxrandr-dev libxinerama-dev libxcursor-dev
          python -m pip install 'numpy>=2,<3' 'scipy>=1.15,<2' 'trimesh>=4,<5'
          mkdir -p "$P1/p7-cherchi-native"
          git rev-parse HEAD > "$P1/p7-cherchi-native/w4-commit.txt"

      - name: Run source SHA, topology, no-fallback and analytic moment tests
        run: |
          set -euo pipefail
          python -m unittest discover -v -s "$P1" -p 'test_p7_cherchi_reference.py' 2>&1 | tee "$P1/p7-cherchi-native/local-scope-tests.log"
          python -m unittest discover -v -s "$P1" -p 'test_p8_cherchi_union_forensics.py' 2>&1 | tee "$P1/p7-cherchi-native/p8-independent-topology-tests.log"
          python -m unittest discover -v -s "$P1" -p 'test_p9_cherchi_handle_joint_sweep.py' 2>&1 | tee "$P1/p7-cherchi-native/p9-geometry-perturbation-tests.log"

      - name: Clone the actual Cherchi 2022 reference code at fixed commit
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$NATIVE_ROOT")"
          git clone https://github.com/gcherchi/InteractiveAndRobustMeshBooleans.git "$NATIVE_ROOT"
          git -C "$NATIVE_ROOT" checkout --detach 7bd6c2697695f555f9a15d7e154e084d841316f0
          test "$(git -C "$NATIVE_ROOT" rev-parse HEAD)" = 7bd6c2697695f555f9a15d7e154e084d841316f0
          test "$(git -C "$NATIVE_ROOT" hash-object main.cpp)" = 3f65d2a0f83b10629f99ed5dcd2781409cdca4b5
          echo 'PINNED_UPSTREAM 7bd6c2697695f555f9a15d7e154e084d841316f0' | tee "$P1/p7-cherchi-native/upstream-pin.log"

      - name: Compile the original Cherchi union executable (no CGAL alternative)
        run: |
          set -euo pipefail
          cmake -S "$P1/p7_cherchi_reference_cli" -B build/w4-cherchi-reference -G Ninja -DCMAKE_BUILD_TYPE=Release "-DW4_CHERCHI_SOURCE=$GITHUB_WORKSPACE/$NATIVE_ROOT" 2>&1 | tee "$P1/p7-cherchi-native/native-configure.log"
          cmake --build build/w4-cherchi-reference --target w4_cherchi_reference_native --parallel 2 2>&1 | tee "$P1/p7-cherchi-native/native-build.log"
          test -x build/w4-cherchi-reference/bin/w4_cherchi_reference_native
          sha256sum build/w4-cherchi-reference/bin/w4_cherchi_reference_native | tee "$P1/p7-cherchi-native/native-binary.sha256"

      - name: Preserve historical P7 three-input Cherchi result, even when invalid
        run: |
          set -uo pipefail
          mkdir -p "$P1/p7-cherchi-native"
          set +e
          python "$P1/p7_cherchi_native_union.py" --native-bin build/w4-cherchi-reference/bin/w4_cherchi_reference_native --upstream-checkout "$NATIVE_ROOT" --out "$P1/p7-cherchi-native" --timeout 120 > "$P1/p7-cherchi-native/cherchi-run.log" 2>&1
          rc=$?
          set -e
          echo "P7 historical variadic outcome: exit=$rc (not promoted to a valid solid)"
          cat "$P1/p7-cherchi-native/cherchi-run.log" | tail -n 50
          printf '%s\n' "$rc" > "$P1/p7-cherchi-native/p7-exit-code.txt"

      # A failed P8 means original unperturbed geometry is still invalid.
      # Continue into P9 *only for a recorded counterfactual geometry test*.
      - name: P8 real Cherchi pairwise/order diagnostic with independent solid gate
        continue-on-error: true
        run: |
          set -euo pipefail
          python "$P1/p8_cherchi_union_forensics.py" --p0 research/SpinIt2014_Teapot_20261018/input/teapot-public-original.obj --p1 "$P1/teapot-topology-candidate-p1.obj" --native-bin build/w4-cherchi-reference/bin/w4_cherchi_reference_native --upstream-checkout "$NATIVE_ROOT" --out "$P1/p8-cherchi-forensics" --timeout 90 | tee "$P1/p7-cherchi-native/p8-forensics-stdout.log"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/SpinIt2014_Teapot_20261018/P1/p8-cherchi-forensics/p8-cherchi-permutations.json')
          proof=json.loads(p.read_text())
          assert proof['accepted'] is True
          assert proof['strict_exact_boolean_proof'] is False
          assert proof['optimized'] is False
          assert any(r.get('geometry_status')=='INDEPENDENT_FLOAT_GEOMETRY_PASS' for r in proof['runs'])
          print('Cherchi numerical solid passes only; still NOT exact/physical/optimized')
          PY

      - name: P9 Cherchi-only controlled handle contact perturbation experiment
        continue-on-error: true # Preserve independently observable reproduction failure; P10 uses frozen original artifact
        run: |
          set -euo pipefail
          if python - <<'PY'
          from pathlib import Path
          import json
          p=Path('research/SpinIt2014_Teapot_20261018/P1/p8-cherchi-forensics/p8-cherchi-permutations.json')
          import sys
          sys.exit(0 if json.loads(p.read_text()).get('accepted') is True else 1)
          PY
          then
            echo 'P8 original source geometry passed; P9 source deviation unnecessary'
          else
            python "$P1/p9_cherchi_handle_joint_sweep.py" --p0 research/SpinIt2014_Teapot_20261018/input/teapot-public-original.obj --p1 "$P1/teapot-topology-candidate-p1.obj" --native-bin build/w4-cherchi-reference/bin/w4_cherchi_reference_native --upstream-checkout "$NATIVE_ROOT" --out "$P1/p9-cherchi-handle-variants" --timeout 90 | tee "$P1/p7-cherchi-native/p9-shift-sweep-stdout.log"
            python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('research/SpinIt2014_Teapot_20261018/P1/p9-cherchi-handle-variants/p9-source-deviation-sweep.json').read_text())
          assert j['status']=='SOURCE_DEVIATING_CHERCHI_NUMERIC_CANDIDATE_AVAILABLE'
          assert j['accepted_candidates']
          assert j['source_meshes_unchanged'] and j['geometry_deviation_is_intentional']
          assert not j['exact_source_conformance'] and not j['actual_optimization_performed']
          print('PASS: strict Cherchi native, deliberately modified handle geometry only; no original-shape/optimization claim')
          PY
          fi

      - name: Fetch immutable successful P9 source for independent P10/P11 downstream research
        uses: actions/download-artifact@v4
        with:
          name: W4-P7-real-Cherchi-reference-geometry-or-failure-not-optimized
          run-id: 39362437035
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/w4-p9-authentic-archive

      - name: Authenticate archived native P9 model and archive journal against frozen historical hashes
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp') if False else Path(__import__('os').environ['RUNNER_TEMP'])/'w4-p9-authentic-archive'
          p=root/'research/SpinIt2014_Teapot_20261018/P1/p9-cherchi-handle-variants'
          h=lambda f:hashlib.sha256(Path(f).read_bytes()).hexdigest()
          mesh=p/'cherchi-body-spout-handle-03.obj'
          journal=p/'p9-source-deviation-sweep.json'
          assert h(mesh)=='154cdfc9ec94b6885a95e596c36ac1382dd2d36ed99e19d0b36c2b9de80b6df4', 'ARCHIVED_P9_MESH_CHANGED'
          assert h(journal)=='14eea8e8bdb58b91d5602d5fa8079743ad0be4dbc5b4c69c444f2e7a8a0ced9c', 'ARCHIVED_P9_JOURNAL_CHANGED'
          j=json.loads(journal.read_text())
          assert j['status']=='SOURCE_DEVIATING_CHERCHI_NUMERIC_CANDIDATE_AVAILABLE'
          assert j['recommended_candidate']['obj_sha256']==h(mesh)
          assert j['recommended_candidate']['shift']==0.005
          assert j['native']['upstream_commit']=='7bd6c2697695f555f9a15d7e154e084d841316f0'
          assert j['native']['binary_sha256']=='ad8f4e012fff474f96c059532ac32290fbf4a969c07d5462e08879466c6a66fb'
          print('ARCHIVED_P9_ACTUAL_CHERCHI_NATIVE_SUCCESS_SOURCE_SHA_PINNED')
          PY

      - name: P10 independent exact-decimal material receipt and P11 preflight tests
        env:
          W4_REAL_P9_OBJ: ${{ runner.temp }}/w4-p9-authentic-archive/research/SpinIt2014_Teapot_20261018/P1/p9-cherchi-handle-variants/cherchi-body-spout-handle-03.obj
          W4_REAL_P9_JOURNAL: ${{ runner.temp }}/w4-p9-authentic-archive/research/SpinIt2014_Teapot_20261018/P1/p9-cherchi-handle-variants/p9-source-deviation-sweep.json
        run: |
          set -euo pipefail
          mkdir -p "$P1/p10-cherchi-seal"
          python -m unittest discover -s "$P1" -p 'test_p10_p11_material.py' -v 2>&1 | tee "$P1/p10-cherchi-seal/local-seven-tests.log"
          python "$P1/p10_cherchi_material_baseline.py" --source "$W4_REAL_P9_OBJ" --p0 research/SpinIt2014_Teapot_20261018/input/teapot-public-original.obj --p1 "$P1/teapot-topology-candidate-p1.obj" --journal "$W4_REAL_P9_JOURNAL" --output "$P1/p10-cherchi-seal" | tee "$P1/p10-cherchi-seal/p10-native-source-audit.log"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/SpinIt2014_Teapot_20261018/P1/p10-cherchi-seal/p10-numeric-source-seal.json').read_text())
          assert r['status']=='NUMERIC_CLOSED_DECIMAL_EXACT_MOMENTS_ONLY'
          assert r['topology']['one_component_closed_preflight']
          assert r['max_abs_error_vs_P9_production_ten']<1e-9
          assert r['source_obj_sha256']=='154cdfc9ec94b6885a95e596c36ac1382dd2d36ed99e19d0b36c2b9de80b6df4'
          assert not r['native_exact_set_identity_certified']
          assert not r['W0_tip_axis_scale_density_F_D_approved']
          print('P10 independent serialized-OBJ decimal exact moments and numeric geometry PASS')
          PY

      - name: P11 actual Cherchi native subtraction with provisional F/D and independent ten-moment check
        run: |
          set -euo pipefail
          python "$P1/p11_cherchi_partition_feasibility.py" --material "$P1/p10-cherchi-seal/cherchi-p9-numeric-original-yup.obj" --native-bin build/w4-cherchi-reference/bin/w4_cherchi_reference_native --output "$P1/p11-trial-FD" --timeout 90 | tee "$P1/p10-cherchi-seal/p11-native-subtraction.log"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/SpinIt2014_Teapot_20261018/P1/p11-trial-FD/p11-experimental-FD-partition.json')
          j=json.loads(p.read_text())
          assert j['status']=='EXPERIMENTAL_CHERCHI_FD_NUMERIC_ADDENDUM_PASS'
          assert j['max_abs_ten_moment_partition_error']<5e-7
          assert not j['material_partition_approved']
          assert not j['W0_fixed_F_removable_D_authorized']
          assert not j['SpinIt_optimization_performed']
          print('P11 real Cherchi subtraction: provisional F/D only, not W0-authorized or optimized')
          PY

      - name: Restore byte-locked genuine P11 material independently of this run's timing metadata
        uses: actions/download-artifact@v4
        with:
          name: W4-P7-real-Cherchi-reference-geometry-or-failure-not-optimized
          run-id: 39403411538
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/w4-p13-frozen-P11
      - name: P13 native Cherchi shaft-and-design overlap repair (exploratory only)
        run: |
          set -euo pipefail
          P13_ARCHIVE="$RUNNER_TEMP/w4-p13-frozen-P11/research/SpinIt2014_Teapot_20261018/P1"
          python "$P1/p13_reconstructed_shaft_domain.py" \
            --m "$P13_ARCHIVE/p10-cherchi-seal/cherchi-p9-numeric-original-yup.obj" \
            --f "$P13_ARCHIVE/p11-trial-FD/p11-F-trial-cherchi-subtraction-unapproved.obj" \
            --d "$P13_ARCHIVE/p11-trial-FD/p11-D-trial-sphere-unapproved.obj" \
            --p11-report "$P13_ARCHIVE/p11-trial-FD/p11-experimental-FD-partition.json" \
            --native-bin build/w4-cherchi-reference/bin/w4_cherchi_reference_native \
            --upstream-checkout "$NATIVE_ROOT" \
            --out "$P1/p13-native-Cherchi-domain" --timeout 90 | tee "$P1/p10-cherchi-seal/p13-real-native-csg.log"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/SpinIt2014_Teapot_20261018/P1/p13-native-Cherchi-domain/p13-native-csg-audit.json')
          r=json.loads(p.read_text())
          assert r['status']=='NATIVE_CHERCHI_EXPLORATORY_SHAFT_DOMAIN_NUMERIC_PASS'
          assert r['true_native_Cherchi_calls']==3 and r['geometry_accepted']
          assert r['max_abs_10_raw_moment_partition_error']<5e-7
          assert not r['material_F_D_W0_admitted'] and not r['final_Faster_optimization']
          print('P13 real Cherchi shaft/domain exploratory only, NOT W0/Faster admitted')
          PY

      - name: P13 independently audit malformed saved Cherchi D-minus-shaft output
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$P1/p13-native-Cherchi-domain"
          python -m unittest discover -v -s "$P1" -p 'test_p13_native_failure_forensics.py' 2>&1 | tee "$P1/p13-native-Cherchi-domain/p13-forensics-tests.log"
          target="$P1/p13-native-Cherchi-domain/p13-D-shaft-excluded.obj"
          log="$P1/p13-native-Cherchi-domain/p13-D-shaft-excluded.native-call.json"
          if [ -s "$target" ] && [ -s "$log" ]; then
