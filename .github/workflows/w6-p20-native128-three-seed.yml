name: W6 P20 three-seed native 128 PINO DensiCrafter confirmation
on:
  push:
    branches:
      - research/neuralmoments-w6-pcraft-20261019
    paths:
      - research/NeuralMoments/models/pcraft_ufno/densicrafter_pino/p20_native128_three_seed.py
      - research/NeuralMoments/models/pcraft_ufno/densicrafter_pino/p20_aggregate.py
      - research/NeuralMoments/models/pcraft_ufno/densicrafter_pino/tests/test_p20_native128.py
      - research/NeuralMoments/models/pcraft_ufno/densicrafter_pino/P20_PROTOCOL.md
      - .github/workflows/w6-p20-native128-three-seed.yml
  workflow_dispatch:
jobs:
  native-128-design:
    name: "Native 128 PINO Densi design seed ${{ matrix.seed }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        seed: [271, 277, 281]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Download trained P14 64-cube PINO checkpoints
        uses: actions/download-artifact@v4
        with:
          name: w6-p14-native-PINO-grid-64
          repository: ${{ github.repository }}
          run-id: 42450889982
          github-token: ${{ github.token }}
          path: /tmp/w6_p14_64
      - name: Install pinned CPU PyTorch
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pytest
      - name: Validate native-128 and contact-scale contracts
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m pytest -q research/NeuralMoments/models/pcraft_ufno/densicrafter_pino/tests/test_p19_native128.py research/NeuralMoments/models/pcraft_ufno/densicrafter_pino/tests/test_p20_native128.py
      - name: Run six-step native-128 design
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m research.NeuralMoments.models.pcraft_ufno.densicrafter_pino.p20_native128_three_seed \
            --checkpoint-dir /tmp/w6_p14_64 --seed ${{ matrix.seed }} --steps 6 --lr 0.06 --wall-cells 4 \
            --output /tmp/w6_p20_native128_seed${{ matrix.seed }}.json
      - name: Archive seed-specific designs
        uses: actions/upload-artifact@v4
        with:
          name: w6-p20-native128-seed-${{ matrix.seed }}
          path: |
            /tmp/w6_p20_native128_seed${{ matrix.seed }}.json
            /tmp/w6_p19_native128_seed${{ matrix.seed }}.pt
          if-no-files-found: error
          retention-days: 30
  aggregate:
    needs: native-128-design
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Download all seed artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: w6-p20-native128-seed-*
          merge-multiple: true
          path: /tmp/w6_p20_all
      - name: Aggregate independent seed results
        env:
          PYTHONPATH: .
        run: |
          python -m research.NeuralMoments.models.pcraft_ufno.densicrafter_pino.p20_aggregate \
            --input-dir /tmp/w6_p20_all --output /tmp/w6_p20_native128_aggregate.json
      - name: Archive aggregate report
        uses: actions/upload-artifact@v4
        with:
          name: w6-p20-native128-three-seed-aggregate
          path: /tmp/w6_p20_native128_aggregate.json
          if-no-files-found: error
          retention-days: 30
