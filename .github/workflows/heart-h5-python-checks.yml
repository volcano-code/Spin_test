name: Heart H5 Python regression (no native release claim)

on:
  push:
    branches:
      - research/heart-p0-p3-20261017
    paths:
      - 'research/Heart_v1_20261017/Cherchi_H1/**'
      - 'research/Heart_v1_20261017/Cherchi_H4/**'
      - 'research/Heart_v1_20261017/Cherchi_H5/**'
      - '.github/workflows/heart-h5-python-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install only isolated test dependencies
        run: python -m pip install 'numpy>=2,<3' 'pytest>=8,<10'
      - name: Run guard and exact algebra tests; native is separately certified
        run: >-
          python -m pytest -q -m 'not native'
          research/Heart_v1_20261017/Cherchi_H5/tests
