name: W6 P12a conditioned QuadrANN geometry contract
on:
  push:
    branches:
      - research/neuralmoments-w6-pcraft-20261019
    paths:
      - research/NeuralMoments/models/pcraft_ufno/p0_integration/selected_pino.py
      - research/NeuralMoments/models/pcraft_ufno/p0_integration/tests/test_p12_material_quadrann.py
      - research/NeuralMoments/models/pcraft_ufno/p0_integration/P12A_PROTOCOL.md
      - .github/workflows/w6-p12a-quad-geometry.yml
  workflow_dispatch:
jobs:
  p12a-material:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned CPU and original QuadrANN dependencies
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install torch-scatter torch-cluster -f https://data.pyg.org/whl/torch-2.5.1+cpu.html
          python -m pip install torch-geometric==2.6.1 numpy pytest
      - name: Run material conditioned and legacy safety contracts
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m pytest -q \
            research/NeuralMoments/models/pcraft_ufno/p0_integration/tests/test_p12_material_quadrann.py \
            research/NeuralMoments/models/pcraft_ufno/p0_integration/tests/test_contracts.py
