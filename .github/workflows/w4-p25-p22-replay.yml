name: W4 P25 TEST_ONLY Cherchi M6 audit after W0 rational fix

on:
  push:
    branches:
      - research/neuralmoments-w4-teapot-p1-20261019
    paths:
      - .github/workflows/w4-p25-p22-replay.yml
      - research/SpinIt2014_Teapot_20261018/P25/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: w4-p25-p22-replay-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  p25-p22-fixed-w0-capacity-rerun:
    if: github.ref == 'refs/heads/research/neuralmoments-w4-teapot-p1-20261019'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      P1: research/SpinIt2014_Teapot_20261018/P1
      P25: research/SpinIt2014_Teapot_20261018/P25
      P25_W0_COMMIT: 5bab2eb2616df306906a6887a273f68acfa49320
      P25_CORE_COMMIT: 58fd12c1306c1c01679a19172e276eef0cb30542
    steps:
      - name: Checkout exact W4 branch revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: w4
          persist-credentials: false

      - name: Checkout fixed W0 contract
        uses: actions/checkout@v4
        with:
          ref: 5bab2eb2616df306906a6887a273f68acfa49320
          path: w0
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout frozen native Core
        uses: actions/checkout@v4
        with:
          ref: 58fd12c1306c1c01679a19172e276eef0cb30542
          path: core
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare evidence directory and build bounded Ubuntu image
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w4-p25"
          docker build --pull \
            --file "$GITHUB_WORKSPACE/w4/$P25/Dockerfile" \
            --tag w4-p25-p22:github-${GITHUB_RUN_ID} \
            "$GITHUB_WORKSPACE/w4/$P25"
          docker image inspect "w4-p25-p22:github-${GITHUB_RUN_ID}" \
            --format '{{.Id}}' | tee "$RUNNER_TEMP/w4-p25/image-id.txt"

      - name: Reuse the already verified 8 GiB native build artifact
        uses: actions/download-artifact@v4
        with:
          name: W4-P25-P22-fixed-W0-8GiB-test-only
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 42172591972
          path: ${{ runner.temp }}/w4-p25

      - name: Verify downloaded native build bytes and module identities
        env:
          P25_EVIDENCE: ${{ runner.temp }}/w4-p25
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ["P25_EVIDENCE"])
          report_path=root/"native-build/P20_NATIVE_BUILD_REPORT.json"
          report=json.loads(report_path.read_text())
          assert report["status"] == "BUILT_AND_IMPORT_VERIFIED_NO_GEOMETRY", report
          assert report["import_probe"]["imports_verified"] is True
          assert report["import_probe"]["geometry_calls"] == 0
          expected={"_make_it_stand":("core/python",None),
                    "_cherchi_core_boolean":("cherchi/python",None),
                    "_cherchi_rational_moments":("cherchi/python",None)}
          for name,(folder,_) in expected.items():
              matches=list((root/"native-build"/folder).glob(name+"*.so"))
              assert len(matches)==1, (name,matches)
              actual=hashlib.sha256(matches[0].read_bytes()).hexdigest()
              assert actual==report["native_modules"][name]["sha256"], name
              print(name,actual)
          print("P25_REUSED_NATIVE_BUILD_VERIFIED")
          PY

      - name: Rerun unchanged W0 native audit in a separate 8 GiB zero-swap container
        run: |
          set -euo pipefail
          docker run --rm --init --network none \
            --memory=8g --memory-swap=8g --cpus=2 --cgroupns=private \
            --mount "type=bind,src=$GITHUB_WORKSPACE/w0,dst=/work/w0,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/core,dst=/work/core,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/w4,dst=/work/w4,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/w4-p25,dst=/output" \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp --env GIT_CONFIG_GLOBAL=/tmp/gitconfig \
            --env P1="$P1" --env P25="$P25" --env P25_W4_COMMIT="$GITHUB_SHA" \
            "w4-p25-p22:github-${GITHUB_RUN_ID}" bash -lc '
              set -euo pipefail
              export PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1
              export OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1
              git config --global --add safe.directory /work/w0
              git config --global --add safe.directory /work/core
              git config --global --add safe.directory /work/w4
              /opt/w4-venv/bin/python "/work/w4/$P25/p25_rerun_p22.py" \
                --w0-root /work/w0 \
                --core-root /work/core \
                --w4-root /work/w4 \
                --p1 "/work/w4/$P1" \
                --native-build /output/native-build \
                --output /output/P25_P22_RERUN
            '
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"w4-p25/P25_P22_RERUN/P25_P22_RERUN_RESULT.json"
          r=json.loads(p.read_text())
          assert r["test_only"] is True
          assert r["formal_M6_executed"] is False
          assert r["formal_M6_passed"] is False
          assert r["native_audit_invoked"] is True
          assert r["diagnostic_captured"] is True
          assert r["formal_resource_admission"] is False
          assert r["w0_commit"] == "5bab2eb2616df306906a6887a273f68acfa49320"
          assert r["core_commit"] == "58fd12c1306c1c01679a19172e276eef0cb30542"
          assert r["native_audit_returned"] is True
          assert r["native_full_partition_certified_test_only"] is True
          assert r["native_evidence_status"] == "REAL_EXACT_FULL_PARTITION_VERIFIED_DERIVATIVE_AND_TERMINAL_PENDING"
          assert r["cgroup_after"].get("memory.max") == "8589934592"
          assert r["cgroup_after"].get("memory.swap.max") == "0"
          events=dict(line.split() for line in r["cgroup_after"]["memory.events"].splitlines())
          assert events.get("oom") == "0" and events.get("oom_kill") == "0"
          calls=r["native_call_counts_final"]
          assert calls["source"] == 1 and calls["boolean"] == 2
          assert calls["derivative"] == 1 and calls["integration"] == 2
          evidence=json.loads((p.parent/"native-evidence.json").read_text())
          assert evidence["native_full_partition_certified"] is True
          assert evidence["retained_plus_cavity_equals_design_r10_exact"] is True
          assert evidence["fixed_plus_retained_density_weighted_moments_verified"] is True
          assert [x["label"] for x in evidence["exact_partition_predicates"]] == ["fixed_plus_design","design_cut","full_outer"]
          for item in evidence["exact_partition_predicates"]:
              facts=item["native_predicate_facts"]
              assert facts["completed"] and facts["complete_partition"]
              assert facts["union_equals_whole"] and facts["no_positive_volume_overlap"]
              assert facts["missing_whole_content"] is False and facts["excess_union_content"] is False
              assert all(facts["part_subset_whole"])
          m5=evidence["M5_evidence"]
          assert m5["w2_exact_math_reference"]["identical_all_ten"] is True
          assert m5["w2_exact_math_reference"]["complete_material_partition_proof"] is False
          assert m5["w2_exact_math_reference"]["independent_cherchi_boolean_proof"] is False
          assert evidence["smooth_derivative_certified"] is False
          assert evidence["newton_terminal_certified"] is False
          assert evidence["training_admissible"] is False
          print("P25_P22_TEST_ONLY_NATIVE_PARTITION_VERIFIED:",r["native_evidence_status"],"calls=",calls)
          PY

      - name: Preserve P25 build, preparation, and TEST_ONLY M6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: W4-P25-P22-fixed-W0-8GiB-test-only
          path: ${{ runner.temp }}/w4-p25/**
          if-no-files-found: warn
          retention-days: 30
