name: W6 P17 trained 64 PINO plus DensiCrafter design
on:
  push:
    branches:
      - research/neuralmoments-w6-pcraft-20261019
    paths:
      - research/NeuralMoments/models/pcraft_ufno/densicrafter_pino/p17_trained_pino.py
      - research/NeuralMoments/models/pcraft_ufno/densicrafter_pino/tests/test_p17_trained_pino.py
      - research/NeuralMoments/models/pcraft_ufno/densicrafter_pino/P17_PROTOCOL.md
      - .github/workflows/w6-p17-trained-pino-densicrafter.yml
  workflow_dispatch:
jobs:
  trained-pino-densi-design:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Download trained P14 64 cube P-CRAFT PINO checkpoint
        uses: actions/download-artifact@v4
        with:
          name: w6-p14-native-PINO-grid-64
          repository: ${{ github.repository }}
          run-id: 42450889982
          github-token: ${{ github.token }}
          path: /tmp/w6_p14_64
      - name: Install pinned CPU PyTorch
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pytest
      - name: Validate protected wall and fail-closed geometry masks
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m pytest -q research/NeuralMoments/models/pcraft_ufno/densicrafter_pino/tests/test_p17_trained_pino.py
      - name: Run four-arm trained PINO and DensiCrafter density design
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m research.NeuralMoments.models.pcraft_ufno.densicrafter_pino.p17_trained_pino \
            --checkpoint-dir /tmp/w6_p14_64 --seed 271 --steps 12 \
            --lr 0.06 --wall-cells 2 \
            --output /tmp/w6_p17_trained64_densicrafter.json
      - name: Archive density designs and independent physical ledgers
        uses: actions/upload-artifact@v4
        with:
          name: w6-p17-trained64-PINO-DensiCrafter
          path: |
            /tmp/w6_p17_trained64_densicrafter.json
            /tmp/w6_p17_densicrafter_pino64_seed271.pt
          if-no-files-found: error
          retention-days: 30
