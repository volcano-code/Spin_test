name: W6 P21 train original QuadrANN proposal around trained P-CRAFT PINO
on:
  push:
    branches:
      - research/neuralmoments-w6-pcraft-20261019
    paths:
      - research/NeuralMoments/models/pcraft_ufno/p0_integration/p21_train_quadrann.py
      - research/NeuralMoments/models/pcraft_ufno/p0_integration/tests/test_p21_quadrann.py
      - research/NeuralMoments/models/pcraft_ufno/p0_integration/P21_PROTOCOL.md
      - .github/workflows/w6-p21-quadrann-pino.yml
  workflow_dispatch:
jobs:
  train-quadrann:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Download trained P14 64-cube P-CRAFT PINO checkpoint
        uses: actions/download-artifact@v4
        with:
          name: w6-p14-native-PINO-grid-64
          repository: ${{ github.repository }}
          run-id: 42450889982
          github-token: ${{ github.token }}
          path: /tmp/w6_p14_64
      - name: Install pinned PyTorch and original QuadrANN dependencies
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install torch-scatter torch-cluster -f https://data.pyg.org/whl/torch-2.5.1+cpu.html
          python -m pip install torch-geometric==2.6.1 numpy pytest
      - name: Validate original QuadrANN, zero-gate parity and Jacobian consistency
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m pytest -q research/NeuralMoments/models/pcraft_ufno/p0_integration/tests/test_quadrann_smoke.py research/NeuralMoments/models/pcraft_ufno/p0_integration/tests/test_p12_material_quadrann.py research/NeuralMoments/models/pcraft_ufno/p0_integration/tests/test_p21_quadrann.py
      - name: Train optional QuadrANN proposal on analytic P0 moment and Jacobian labels
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m research.NeuralMoments.models.pcraft_ufno.p0_integration.p21_train_quadrann \
            --checkpoint-dir /tmp/w6_p14_64 --seed 883 --steps 60 --batch-size 4 --lr 0.001 \
            --output /tmp/w6_p21_quadrann_seed883.json
      - name: Archive trained QuadrANN adapter and held-out comparison
        uses: actions/upload-artifact@v4
        with:
          name: w6-p21-trained-quadrann-around-pino
          path: |
            /tmp/w6_p21_quadrann_seed883.json
            /tmp/w6_p21_quadrann_seed883.pt
          if-no-files-found: error
          retention-days: 30
