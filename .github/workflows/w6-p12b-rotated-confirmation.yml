name: W6 P12b exact cube rotated holdout
on:
  push:
    branches:
      - research/neuralmoments-w6-pcraft-20261019
    paths:
      - research/NeuralMoments/models/pcraft_ufno/p0_integration/p12_train.py
      - research/NeuralMoments/models/pcraft_ufno/p0_integration/tests/test_p12_train.py
      - research/NeuralMoments/models/pcraft_ufno/p0_integration/P12B_CONFIRMATORY_PROTOCOL.md
      - .github/workflows/w6-p12b-rotated-confirmation.yml
  workflow_dispatch:
jobs:
  p12b-new-seeds:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned CPU and original candidate models
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install torch-scatter torch-cluster -f https://data.pyg.org/whl/torch-2.5.1+cpu.html
          python -m pip install torch-geometric==2.6.1 numpy pytest
          python -m pip install "git+https://github.com/neuraloperator/neuraloperator.git@a6648eeeb60fe0837f2d7d021517a945a159a0c8"
      - name: Check exact-cube and PINO-primary provenance
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m pytest -q research/NeuralMoments/models/pcraft_ufno/p0_integration/tests/test_p12_train.py
      - name: Train three new seed runs on cube-rotated heldout geometry
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m research.NeuralMoments.models.pcraft_ufno.p0_integration.p12_train \
            --seeds 211,223,227 --base-steps 80 --adapter-steps 36 \
            --uq-steps 48 --train-geometries-per-family 14 \
            --test-ellipsoids 8 --test-rotation cube \
            --output /tmp/w6_p12b_new_seed_cube.json
      - name: Upload exact transformed heldout and before/after learning evidence
        uses: actions/upload-artifact@v4
        with:
          name: w6-p12b-rotated-new-seeds
          path: /tmp/w6_p12b_new_seed_cube.json
          if-no-files-found: error
          retention-days: 30
