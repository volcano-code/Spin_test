name: W6 P26.1 PINO geometry plugin port contracts
on:
  push:
    branches:
      - research/neuralmoments-w6-pcraft-20261019
    paths:
      - research/NeuralMoments/models/pcraft_ufno/spin_pino/spin_pino.py
      - research/NeuralMoments/models/pcraft_ufno/spin_pino/tests/test_geometry_plugin_port.py
      - research/NeuralMoments/models/pcraft_ufno/spin_pino/figconvnet_adapter.py
      - research/NeuralMoments/models/pcraft_ufno/spin_pino/tests/test_figconvnet_adapter.py
      - .github/workflows/w6-p26-1-geometry-plugin-port.yml
  workflow_dispatch:
jobs:
  geometry-plugin-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned CPU PyTorch and pytest
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pytest
      - name: Test zero-gated geometry plugin and PINO identity
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m pytest -q \
            research/NeuralMoments/models/pcraft_ufno/spin_pino/tests/test_geometry_plugin_port.py \
            research/NeuralMoments/models/pcraft_ufno/spin_pino/tests/test_figconvnet_adapter.py
