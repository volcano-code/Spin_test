name: W6 M10b 32-cube confirmatory training
on:
  push:
    branches:
      - research/neuralmoments-w6-pcraft-20261019
    paths:
      - research/NeuralMoments/models/pcraft_ufno/spin_pino/M10B_CONFIRMATORY_PROTOCOL.md
      - .github/workflows/w6-m10b-32-confirmation.yml
  workflow_dispatch:
jobs:
  m10b-32-analytic-train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install stable CPU stack
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest numpy
      - name: Validate analytic source lineage and same-capacity interfaces
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m pytest -q research/NeuralMoments/models/pcraft_ufno/spin_pino/tests/test_m10b_train.py
      - name: Three-seed 32-cube 180-step fair comparison
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m research.NeuralMoments.models.pcraft_ufno.spin_pino.m10b_train \
            --seeds 131,137,139 --steps 180 --source-resolution 32 \
            --geometries-per-family 12 --test-ellipsoids 8 \
            --output /tmp/w6_m10b_confirmatory_32_180.json
      - name: Persist all source digests and metrics
        uses: actions/upload-artifact@v4
        with:
          name: w6-m10b-confirmatory-32-180
          path: /tmp/w6_m10b_confirmatory_32_180.json
          retention-days: 30
          if-no-files-found: error
