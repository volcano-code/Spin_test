name: W2 M23-P2 host recovery-report audit tests

on:
  push:
    branches:
      - research/neuralmoments-w2-teacher-20261019
    paths:
      - 'research/NeuralMoments/teacher/m23_p2_recovery_report_audit.py'
      - 'research/NeuralMoments/teacher/test_m23_p2_recovery_report_audit.py'
      - '.github/workflows/w2-m23-p2-recovery-report-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-report-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify read-only report parser and fail-closed SHA gate
        working-directory: research/NeuralMoments/teacher
        run: python -m unittest -v test_m23_p2_recovery_report_audit.py
