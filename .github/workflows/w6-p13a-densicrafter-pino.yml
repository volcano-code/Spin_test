name: W6 P13a DensiCrafter density-PINO coupling
on:
  push:
    branches:
      - research/neuralmoments-w6-pcraft-20261019
    paths:
      - research/NeuralMoments/models/pcraft_ufno/densicrafter_pino/**
      - .github/workflows/w6-p13a-densicrafter-pino.yml
  workflow_dispatch:
jobs:
  p13a-cpu-density-pino:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU Torch numerical stack
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pytest
      - name: Test actual original-core DensiCrafter to PINO gradient integration
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m pytest -q \
            research/NeuralMoments/models/pcraft_ufno/densicrafter_pino/tests/test_bridge.py \
            research/NeuralMoments/models/pcraft_ufno/spin_pino/tests/test_spin_pino.py
