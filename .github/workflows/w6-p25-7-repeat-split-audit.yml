name: W6 P25.7 repeated geometry split and training seed audit

on:
  push:
    branches:
      - research/neuralmoments-w6-pcraft-20261019
    paths:
      - .github/workflows/w6-p25-7-repeat-split-audit.yml
      - research/NeuralMoments/models/pcraft_ufno/densicrafter_pino/p25_uqno_repeat_split_audit.py
      - research/NeuralMoments/models/pcraft_ufno/densicrafter_pino/p25_uqno_aggregate_train.py
      - research/NeuralMoments/models/pcraft_ufno/densicrafter_pino/tests/test_p25_uqno_repeat_split_audit.py
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: w6-p25-7-repeat-split-audit
  cancel-in-progress: false

jobs:
  repeated-split-training-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned CPU PyTorch and NumPy
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4
      - name: Test geometry split salt contracts
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s research/NeuralMoments/models/pcraft_ufno/densicrafter_pino/tests -p 'test_p25_uqno_repeat_split_audit.py' -v
      - name: Download frozen P25.1 nine-shard dataset
        uses: actions/download-artifact@v4
        with:
          pattern: w6-p25-1-uqno-signals-seed-*
          repository: ${{ github.repository }}
          run-id: 42661880377
          github-token: ${{ github.token }}
          merge-multiple: true
          path: /tmp/w6_p25_1_all
      - name: Verify exact P25.1 shard coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/w6_p25_1_all")
          expected = {
              f"w6_p25_1_seed{s}_{f}.json"
              for s in (271, 277, 281)
              for f in ("box", "sphere", "ellipsoid")
          }
          actual = {p.name for p in root.glob("*.json")}
          if actual != expected:
              raise SystemExit(f"shard mismatch: missing={sorted(expected-actual)}, extra={sorted(actual-expected)}")
          total = 0
          for p in root.glob("*.json"):
              d = json.loads(p.read_text())
              if len(d.get("rows", [])) != 320:
                  raise SystemExit(f"bad row count: {p.name}")
              total += len(d["rows"])
          if total != 2880:
              raise SystemExit(f"expected 2880 rows, got {total}")
          print({"shards": len(actual), "rows": total})
          PY
      - name: Run three split salts and three training initializations
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m research.NeuralMoments.models.pcraft_ufno.densicrafter_pino.p25_uqno_repeat_split_audit \
            --input-dir /tmp/w6_p25_1_all \
            --output-dir /tmp/w6_p25_7_runs \
            --output /tmp/w6_p25_7_repeat_split_audit.json
      - name: Archive repeated split audit and model checkpoints
        uses: actions/upload-artifact@v4
        with:
          name: w6-p25-7-repeat-split-audit
          path: |
            /tmp/w6_p25_7_repeat_split_audit.json
            /tmp/w6_p25_7_runs/**/checkpoints/*.pt
          if-no-files-found: error
          retention-days: 90
