name: W4 P24 W0 exact rational boundary acceptance

on:
  push:
    branches:
      - research/neuralmoments-w4-teapot-p1-20261019
    paths:
      - .github/workflows/w4-p24-w0-rational-fix.yml
      - research/SpinIt2014_Teapot_20261018/P1/p23_rational_token_transport.py
      - research/SpinIt2014_Teapot_20261018/P1/test_p24_retained_transport.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: w4-p24-w0-rational-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  p24-fixed-w0-rational-boundary:
    if: github.ref == 'refs/heads/research/neuralmoments-w4-teapot-p1-20261019'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      P24_W0_COMMIT: 5bab2eb2616df306906a6887a273f68acfa49320
      P24_W0_FIX_COMMIT: 06984ae7ef5b09893e0f1b269d4e00dd5b9f1c58
      P24_CORE_COMMIT: 58fd12c1306c1c01679a19172e276eef0cb30542
      P1: research/SpinIt2014_Teapot_20261018/P1
    steps:
      - name: Checkout exact W4 revision
        uses: actions/checkout@v4
        with:
          path: w4
          persist-credentials: false

      - name: Checkout current W0 branch with the accepted fix in ancestry
        uses: actions/checkout@v4
        with:
          ref: 5bab2eb2616df306906a6887a273f68acfa49320
          path: w0
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout frozen native Core
        uses: actions/checkout@v4
        with:
          ref: 58fd12c1306c1c01679a19172e276eef0cb30542
          path: core
          persist-credentials: false

      - name: Prepare Python 3.12 and exact-boundary dependency
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify commit ancestry and all W0 source blob pins
        run: |
          set -euo pipefail
          test "$(git -C w0 rev-parse HEAD)" = "$P24_W0_COMMIT"
          test "$(git -C core rev-parse HEAD)" = "$P24_CORE_COMMIT"
          git -C w0 merge-base --is-ancestor "$P24_W0_FIX_COMMIT" HEAD
          test "$(git -C w0 rev-parse HEAD:research/NeuralMoments/contracts/native_teacher_replay.py)" = "4ddd0250ad4a9803139fdd1948c8d4b4e31abf5f"
          test "$(git -C w0 rev-parse HEAD:research/NeuralMoments/contracts/full_partition_m6.py)" = "7f18bafa1094ae38eadc0fa13cde7730c35cfe32"
          test "$(git -C w0 rev-parse HEAD:research/NeuralMoments/contracts/test_native_teacher_replay.py)" = "d6413fe1e50ea806711470c614e109b2b0b308e4"
          test "$(git -C w0 rev-parse HEAD:research/NeuralMoments/contracts/test_full_partition_m6_synthetic.py)" = "bfa4b6e77c63bf40ef5583e4fc528a1349792abd"
          git -C w0 diff --exit-code HEAD --
          git -C core diff --exit-code HEAD --
          echo "W0 fix ancestry, current branch SHA, four source/test blobs and Core SHA verified."

      - name: Install NumPy for the strict Core mesh contract
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'numpy==2.3.5'

      - name: Execute P23 against fixed W0 and require both real call sites
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w4-p24-evidence"
          python "w4/$P1/p23_rational_token_transport.py" \
            --w0-root "$GITHUB_WORKSPACE/w0" \
            --core-root "$GITHUB_WORKSPACE/core" \
            --expected-w0-commit "$P24_W0_COMMIT" \
            --require-fixed \
            --output "$RUNNER_TEMP/w4-p24-evidence/P24_FIXED_W0_TRANSPORT.json" \
            2>&1 | tee "$RUNNER_TEMP/w4-p24-evidence/p23-fixed.log"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"w4-p24-evidence/P24_FIXED_W0_TRANSPORT.json"
          r=json.loads(p.read_text())
          assert r["status"] == "P23_W0_RATIONAL_BOUNDARY_FIX_VERIFIED"
          assert r["successful"] is True and r["require_fixed"] is True
          assert r["w0_commit"] == os.environ["P24_W0_COMMIT"]
          assert r["core_commit"] == os.environ["P24_CORE_COMMIT"]
          assert (r["tests_run"],r["failures"],r["errors"],r["skipped"]) == (5,0,0,0)
          assert r["cherchi_native_calls"] == 0 and r["formal_M6_executed"] is False
          print("P24_FIXED_W0_TRANSPORT_REPORT_VERIFIED")
          PY

      - name: Test P24 retained-input static guard against false positives
        working-directory: w4/research/SpinIt2014_Teapot_20261018/P1
        run: |
          set -euo pipefail
          python -m unittest -v test_p24_retained_transport.py \
            2>&1 | tee "$RUNNER_TEMP/w4-p24-evidence/p24-retained-guard.log"

      - name: Preserve P24 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: W4-P24-fixed-W0-rational-boundary-acceptance
          path: |
            ${{ runner.temp }}/w4-p24-evidence/**
          if-no-files-found: warn
          retention-days: 30
