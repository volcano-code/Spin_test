name: W6 P0 upstream smoke
on:
  push:
    branches:
      - research/neuralmoments-w6-pcraft-20261019
    paths:
      - research/NeuralMoments/models/pcraft_ufno/p0_integration/**
      - research/NeuralMoments/models/pcraft_ufno/spin_pino/**
      - research/NeuralMoments/models/pcraft_ufno/PINO_CORE_SOURCE_AUDIT.md
      - research/NeuralMoments/models/pcraft_ufno/SPIN_PINO_30DAY_PLAN.md
      - .github/workflows/w6-p0-upstream-smoke.yml
jobs:
  neuraloperator-and-quadrann-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU PyTorch
        run: python -m pip install --upgrade pip && python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install PyG CPU extensions
        run: python -m pip install torch-scatter torch-cluster -f https://data.pyg.org/whl/torch-2.5.1+cpu.html && python -m pip install torch-geometric==2.6.1
      - name: Install pinned NeuralOperator
        run: python -m pip install "git+https://github.com/neuraloperator/neuraloperator.git@a6648eeeb60fe0837f2d7d021517a945a159a0c8"
      - name: Install test runner
        run: python -m pip install pytest numpy
      - name: Run adapter contract and upstream CPU smoke tests
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python -m pytest -q research/NeuralMoments/models/pcraft_ufno/p0_integration/tests
  algoim-cpp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure pinned Algoim smoke
        run: cmake -S research/NeuralMoments/models/pcraft_ufno/p0_integration/algoim -B /tmp/w6-algoim-build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build /tmp/w6-algoim-build --parallel 2
      - name: Print Algoim ten-moment reference and max error
        run: /tmp/w6-algoim-build/algoim_moment_smoke
      - name: Verify analytic unit-sphere ten moments
        run: ctest --test-dir /tmp/w6-algoim-build --output-on-failure --verbose
  spin-pino-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU PyTorch
        run: python -m pip install --upgrade pip && python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install pytest and NumPy from PyPI
        run: python -m pip install pytest numpy
      - name: Run PINO-first Spin moment tests
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python -m pytest -q research/NeuralMoments/models/pcraft_ufno/spin_pino/tests/test_spin_pino.py research/NeuralMoments/models/pcraft_ufno/spin_pino/tests/test_dataset.py research/NeuralMoments/models/pcraft_ufno/spin_pino/tests/test_sweep.py research/NeuralMoments/models/pcraft_ufno/spin_pino/tests/test_tournament.py research/NeuralMoments/models/pcraft_ufno/spin_pino/tests/test_loss_conditioning.py research/NeuralMoments/models/pcraft_ufno/spin_pino/tests/test_equivariance.py
  spin-pino-analytic-training:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU PyTorch and numerical dependencies
        run: python -m pip install --upgrade pip && python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu && python -m pip install numpy
      - name: Run three-seed analytic Spin-PINO training
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m research.NeuralMoments.models.pcraft_ufno.spin_pino.train \
            --seeds 131,137,139 \
            --train-geometries-per-family 16 \
            --test-ellipsoid-geometries 8 \
            --queries-per-geometry 2 \
            --steps 120 --batch-size 8 --grid-size 8 --device cpu \
            --output /tmp/spin_pino_m1_three_seed.json --save-checkpoints
      - name: Upload training report and checkpoints
        uses: actions/upload-artifact@v4
        with:
          name: spin-pino-m1-analytic-three-seed
          path: /tmp/spin_pino_m1_three_seed*
          if-no-files-found: error
          retention-days: 30
  spin-pino-m2-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU PyTorch and numerical dependencies
        run: python -m pip install --upgrade pip && python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu && python -m pip install numpy
      - name: Run controlled three-seed Spin-PINO M2 sweep
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m research.NeuralMoments.models.pcraft_ufno.spin_pino.sweep \
            --seeds 131,137,139 --steps 120 --batch-size 8 --device cpu \
            --output /tmp/spin_pino_m2_sweep.json
      - name: Upload M2 sweep results
        uses: actions/upload-artifact@v4
        with:
          name: spin-pino-m2-controlled-sweep
          path: /tmp/spin_pino_m2_sweep.json
          if-no-files-found: error
          retention-days: 30
  spin-pino-m2b-support-masked-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU PyTorch and numerical dependencies
        run: python -m pip install --upgrade pip && python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu && python -m pip install numpy
      - name: Run support-masked three-seed PINO sweep
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m research.NeuralMoments.models.pcraft_ufno.spin_pino.sweep \
            --seeds 131,137,139 --steps 120 --batch-size 8 --device cpu \
            --output /tmp/spin_pino_m2b_support_masked.json
      - name: Upload support-masked M2b results
        uses: actions/upload-artifact@v4
        with:
          name: spin-pino-m2b-support-masked
          path: /tmp/spin_pino_m2b_support_masked.json
          if-no-files-found: error
          retention-days: 30
  spin-pino-m3-same-data-tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU PyTorch and numerical dependencies
        run: python -m pip install --upgrade pip && python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu && python -m pip install numpy
      - name: Run same-data PINO, W6 M7 and W5 DeepONet tournament
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m research.NeuralMoments.models.pcraft_ufno.spin_pino.tournament \
            --seeds 131,137,139 --steps 120 --batch-size 8 \
            --output /tmp/spin_pino_m3_tournament.json
      - name: Upload M3 tournament report
        uses: actions/upload-artifact@v4
        with:
          name: spin-pino-m3-same-data-tournament
          path: /tmp/spin_pino_m3_tournament.json
          if-no-files-found: error
          retention-days: 30
  spin-pino-m4-loss-conditioning:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU PyTorch and numerical dependencies
        run: python -m pip install --upgrade pip && python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu && python -m pip install numpy
      - name: Run PINO loss preconditioning and PCGrad ablation
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m research.NeuralMoments.models.pcraft_ufno.spin_pino.conditioning_sweep \
            --seeds 131,137,139 --steps 120 --batch-size 8 \
            --output /tmp/spin_pino_m4_loss_conditioning.json
      - name: Upload M4 loss-conditioning report
        uses: actions/upload-artifact@v4
        with:
          name: spin-pino-m4-loss-conditioning
          path: /tmp/spin_pino_m4_loss_conditioning.json
          if-no-files-found: error
          retention-days: 30
  spin-pino-m6-rotation-generalization:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU PyTorch and numerical dependencies
        run: python -m pip install --upgrade pip && python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu && python -m pip install numpy
      - name: Run logistic PINO cube-rotation augmentation comparison
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m research.NeuralMoments.models.pcraft_ufno.spin_pino.rotation_sweep \
            --seeds 131,137,139 --steps 120 --batch-size 8 \
            --output /tmp/spin_pino_m6_rotation_sweep.json
      - name: Upload M6 rotation-generalization report
        uses: actions/upload-artifact@v4
        with:
          name: spin-pino-m6-rotation-generalization
          path: /tmp/spin_pino_m6_rotation_sweep.json
          if-no-files-found: error
          retention-days: 30
