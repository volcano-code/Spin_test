name: W4 P32 frozen P19 triangle screen
on:
  push:
    branches:
      - research/neuralmoments-w4-teapot-p1-20261019
    paths:
      - .github/workflows/w4-p32-triangle-screen.yml
      - research/SpinIt2014_Teapot_20261018/P32/p32_*.py
      - research/SpinIt2014_Teapot_20261018/P32/test_p32*.py
      - research/SpinIt2014_Teapot_20261018/P33/p33d_*.py
      - research/SpinIt2014_Teapot_20261018/P33/test_p33*.py
      - research/SpinIt2014_Teapot_20261018/P30/p30b_run_approved_native_pilot.sh
      - research/SpinIt2014_Teapot_20261018/P30/p30b_authority.py
      - research/SpinIt2014_Teapot_20261018/P30/p30b_native_sampler.py
      - research/SpinIt2014_Teapot_20261018/P30/p30_neighborhood_preflight.py
      - research/SpinIt2014_Teapot_20261018/P1/P19_material_case/material/M_native.obj
      - research/SpinIt2014_Teapot_20261018/P1/P19_material_case/material/D_native.obj
      - research/SpinIt2014_Teapot_20261018/P1/P19_material_case/source/shaft-reference.obj
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w4-p32-triangle-screen
  cancel-in-progress: false
jobs:
  deterministic-screen:
    if: github.ref == 'refs/heads/research/neuralmoments-w4-teapot-p1-20261019'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run reproducible P32 screen
        run: |
          set -euo pipefail
          python -m py_compile research/SpinIt2014_Teapot_20261018/P32/p32_triangle_screen.py research/SpinIt2014_Teapot_20261018/P32/test_p32_triangle_screen.py research/SpinIt2014_Teapot_20261018/P33/p33d_static_chain_audit.py research/SpinIt2014_Teapot_20261018/P33/test_p33d_static_chain_audit.py
          python -m unittest discover -v -s research/SpinIt2014_Teapot_20261018/P32 -p 'test_p32_triangle_screen.py'
          python -m unittest discover -v -s research/SpinIt2014_Teapot_20261018/P33 -p 'test_p33d_static_chain_audit.py'
          python research/SpinIt2014_Teapot_20261018/P33/p33d_static_chain_audit.py
      - name: Emit diagnostic JSON
        run: |
          set -euo pipefail
          python research/SpinIt2014_Teapot_20261018/P32/p32_triangle_screen.py --repo . --output "$RUNNER_TEMP/P32_TRIANGLE_SCREEN.json"
          test -s "$RUNNER_TEMP/P32_TRIANGLE_SCREEN.json"
          cat "$RUNNER_TEMP/P32_TRIANGLE_SCREEN.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload immutable diagnostic result
        uses: actions/upload-artifact@v4
        with:
          name: W4-P32-triangle-screen-${{ github.sha }}
          path: ${{ runner.temp }}/P32_TRIANGLE_SCREEN.json
          if-no-files-found: error
          retention-days: 30
