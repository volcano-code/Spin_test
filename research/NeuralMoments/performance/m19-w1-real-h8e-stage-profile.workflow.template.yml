# W1-OWNED INACTIVE TEMPLATE. CI OWNER MUST REGISTER SEPARATELY ON AN
# AUTHORIZED WORKFLOW REF. DO NOT WRITE .github/workflows OR main FROM W1.
# No production speed/derivative certification is conferred by this workflow.
name: W1 M19 real H8e hierarchical Cherchi profile
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: spin-w1-m19-cherchi-native
  cancel-in-progress: false
jobs:
  pinned-real-h8e:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      DEBIAN_FRONTEND: noninteractive
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/neuralmoments-w1-native-20261019
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Verify W1 source and frozen ancestry
        run: |
          test "$(git symbolic-ref --short HEAD)" = 'research/neuralmoments-w1-native-20261019'
          git merge-base --is-ancestor 0bcc187b3005478baa586a6d6f450e73811ca342 HEAD
      - name: Install CI-only native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake libgmp-dev libmpfr-dev \
            libboost-all-dev libtbb-dev libeigen3-dev libgl1-mesa-dev \
            libglu1-mesa-dev libx11-dev libxi-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev pkg-config
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install fixed Python dependencies
        run: |
          python -m pip install 'pybind11==3.0.1' 'numpy>=2,<3' \
            'pytest>=8,<10' 'scipy>=1.14,<2' 'shapely>=2,<3' \
            'scikit-image>=0.24,<1' 'trimesh>=4,<5'
      - name: Source-pinned driver AST smoke BEFORE native compilation
        run: |
          python - <<'PYCODE'
          import sys
          from pathlib import Path
          sys.path.insert(0,'research/NeuralMoments/performance')
          from m19_real_h8e_profiler import (H8E_SOURCE_REL, rewrite_frozen_run)
          path=Path(H8E_SOURCE_REL)
          _,names=rewrite_frozen_run(path.read_text())
          assert len(names)==6
          print('M19_EXACT_FROZEN_H8E_AST_AUTHENTICATED')
          PYCODE
      - name: Download SHA-pinned genuine H8c frozen inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          curl --fail --location --retry 3 --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/volcano-code/Spin_test/actions/artifacts/12132634988/zip' \
            --output artifacts/w1-h8c-reference.zip
          echo '78749e99abd25ab2d2571440991ffa4e907a1565b4e20298f8516e061c  artifacts/w1-h8c-reference.zip' | sha256sum --check
      - name: Build actual native modules WITHOUT prematurely running strict M9
        run: |
          python research/NeuralMoments/performance/m13_pinned_native_build.py \
            --execute --fetch-pinned-sources --build-only --workers 2 \
            --root "$PWD" --archive "$PWD/artifacts/w1-h8c-reference.zip" \
            --output "$PWD/artifacts/w1-m19-built"
      - name: Perform real 25-point H8e original science and hierarchical profiling
        run: |
          # Known historical H8e source-feature failure must stay a CI failure.
          # An ACTUAL completed 25-point diagnostic writes baseline-performance
          # alongside failure.json, whereas missing build/native proof writes
          # only failure.json. Both outcomes upload immutable raw evidence.
          python research/NeuralMoments/performance/m19_real_h8e_profiler.py \
            --root "$PWD" --archive "$PWD/artifacts/w1-h8c-reference.zip" \
            --module-dir "$PWD/build/w1-m13-core/python" \
            --module-dir "$PWD/build/w1-m13-cherchi/python" \
            --output "$PWD/artifacts/w1-m19-real-native"
      - name: Always preserve original stage records, including failed scientific gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w1-m19-genuine-h8e-native-timings-or-blocker
          if-no-files-found: warn
          path: |
            artifacts/w1-m19-real-native/
            artifacts/w1-m19-built/
            build/w1-m13-core/CMakeCache.txt
            build/w1-m13-cherchi/CMakeCache.txt
            build/w1-m13-core/CMakeFiles/CMakeConfigureLog.yaml
            build/w1-m13-cherchi/CMakeFiles/CMakeConfigureLog.yaml
